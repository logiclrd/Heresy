name: Heresy Build & Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: ubuntu-latest  # For a list of available runner types, refer to
                            # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Inspect libsndfile MSBuild selection
      run: |
        dotnet restore Heresy.Render.File/Heresy.Render.File.csproj
        dotnet msbuild Heresy.Render.File/Heresy.Render.File.csproj -getProperty:RuntimeIdentifier -getProperty:NETCoreSdkRuntimeIdentifier -getProperty:_SndFileRid -getProperty:Pkgorg_sndfile_runtime_linux_x64
        dotnet build Heresy.Render.File/Heresy.Render.File.csproj -p:Configuration=Release --no-restore
        find Heresy.Render.File/bin/Release -maxdepth 4 -type f -name '*.so' -print

    - name: Execute test suite
      run: dotnet test -p:Configuration=Release --logger "console;verbosity=normal"

    - name: Verify desktop host and SDL native runtimes
      run: |
        dotnet build Heresy/Heresy.csproj -p:Configuration=Release --no-restore
        test -f Heresy/bin/Release/net10.0/runtimes/linux-x64/native/libSDL3.so
        test -f Heresy/bin/Release/net10.0/runtimes/win-x64/native/SDL3.dll
        test -f Heresy/bin/Release/net10.0/runtimes/osx-x64/native/libSDL3.dylib
